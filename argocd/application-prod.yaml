apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-canary-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hiba-Farah/gitops-canary-config.git
    targetRevision: main
    path: apps/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gitops-canary-app
  namespace: prod
spec:
  replicas: 3
  strategy:
    canary:
      canaryService: gitops-canary-app-canary
      stableService: gitops-canary-app-stable
      trafficRouting:
        nginx:
          stableIngress: gitops-canary-app
      steps:
        - setWeight: 20
        - pause:
            duration: 45s
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: canaryHash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 25
        - pause:
            duration: 45s
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: canaryHash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause:
            duration: 45s
        - setWeight: 100
  selector:
    matchLabels:
      app: gitops-canary-app
  template:
    metadata:
      labels:
        app: gitops-canary-app
    spec:
      containers:
        - name: app
          image: ghcr.io/hiba-farah/gitops-canary-app:829b06e
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: APP_VERSION
              value: "v2"
            - name: FAIL_RATE
              value: "0"

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-canary-app
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: prod.canary.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-canary-app-stable
                port:
                  number: 80
